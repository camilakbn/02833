<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 9 - CN</title>
    <style>
        table {
            border: solid 2px blue;
        }
        td {
            border: solid 1px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Exercícios</h1>
    <h2>Exercício 9</h2>
    <table width="400px">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>quatro</td>
            <td>cinco</td>
            <td>seis</td>
        </tr>
    </table>
    <br>
    <h2>Exercício 9A</h2>
    <table width="400px">
        <tr>
            <td colspan="2">1 e 2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>quatro</td>
            <td>cinco</td>
            <td>seis</td>
        </tr>
    </table>
    <br>
    <h2>Exercício 9B</h2>
    <table width="400px">
        <tr>
            <td rowspan="2">1 e quatro</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>cinco</td>
            <td>seis</td>
        </tr>
    </table>
    <br>
    <h2>Exercício 9C</h2>
    <table width="400px">
        <tr>
            <td colspan="2">1 e 2</td>
            <td rowspan="2">3 e seis</td>
        </tr>
        <tr>
            <td>quatro</td>
            <td>cinco</td>
        </tr>
    </table>
</body>
</html>
