<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo image map - CN</title>
</head>
<body>
    <h1>Demonstração de uma image map</h1>
    <img src="workspace.jpg" alt="workspace" usemap="#area">
    <map name="area">
        <area shape="rect" coords="123,194,334,279" href="https://www.worten.pt/" alt="portatil" title="PC da Camila">
        <area shape="circle"; coords="387, 294, 20" href="https://pt.wikipedia.org/wiki/Café" alt="coffee" title="Café da Camila">
        <area shape="rect" coords="321,50, 458, 160" href="https://www.worten.pt/" alt="monitor" title="Monitor da Camila">
    </map>
</body>
</html>
